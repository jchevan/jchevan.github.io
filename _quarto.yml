project:
  type: website
  output-dir: docs
  resources:
    - static/h5p-test.html
    - h5p/

website:
  title: "JChev"
  page-footer:
    center: |
      <script>
        document.write('<img src="https://visitor-badge.laobi.icu/badge?page_id=jchevan.github.io.' + encodeURIComponent(window.location.pathname) + '" alt="Page Visitors"/>');
      </script>
  sidebar:
    logo: images/JCLogoBl.png
    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Home
        icon: bi-house

      - section: "Bio"
        icon: bi-fingerprint
        contents:
          - href: cv.qmd
            text: CV
            icon: bi-file-earmark-person
          - href: publications.qmd
            text: Publications
            icon: bi-journal-text

      - section: "Projects"
        icon: bi-clipboard-data
        contents:
          - href: projects.qmd
            text: Collaborations & Labs
            icon: bi-list-task
          - href: driverdiagram.qmd
            text: ADRD Driver Diagram
            icon: bi-grid-1x2
          - href: static/h5p-test.html
            text: H5P Timeline for Arthritis
            icon: bi-clock-history
            target: _blank

      - section: "In Vivo"
        icon: bi-heart-pulse
        contents:
          - href: books.qmd
            text: What I'm reading
            icon: bi-book
          - href: music.qmd
            text: What I'm listening to
            icon: bi-music-note-list
          - href: maker.qmd
            text: What I'm making
            icon: bi-tools
          - href: personal.qmd
            text: Some other stuff I like
            icon: bi-hand-thumbs-up
    
format:
  html:
    theme:
      - flatly
    css: styles.css
    toc: true
    link-external-newwindow: true

editor: source

